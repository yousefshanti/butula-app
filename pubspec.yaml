name: butula
description: "البطولة — تطبيق تتبّع العادات الجماعي مع نظام نقاط وتقرير يومي معتمد ومتصدرين."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase (all have verified iOS support)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1

  # Charts
  fl_chart: ^0.69.2

  # Local notifications + timezone
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # UI / fonts / pickers
  google_fonts: ^6.2.1
  emoji_picker_flutter: ^3.1.0

  # Utilities
  intl: any
  collection: ^1.18.0
  shared_preferences: ^2.3.3

  # Data export (.xlsx) + sharing
  excel: ^4.0.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # PDF (commitment document) + version check
  pdf: ^3.11.1
  printing: ^5.13.4
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: false
  assets:
    - shorebird.yaml

# App launcher icons generated from app_icon.png (1024x1024).
flutter_launcher_icons:
  image_path: "app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#1a472a"
  adaptive_icon_foreground: "app_icon.png"
